/janggi_pick_place2:
  ros__parameters:
    # mock: internal simulation; virtual: emulator arm + RViz gripper; real: hardware.
    backend: mock
    robot_namespace: dsr01
    # Empty means the controller must report the unnamed/default flange TCP.
    # Named tool TCPs are not accepted: joint-6 flange is the controller reference.
    expected_flange_tcp_name: ''
    # Used only by the explicit home action; pick never homes automatically.
    # 사용자가 실물에서 확인한 홈 자세 [deg]. J1/J4의 미세 오차는 0으로 저장.
    home_joint_deg: [0.0, -13.694, 134.216, 0.0, 59.485, 90.0]
    # J6 작업 범위. 같은 방향의 +/-360도 해 중 범위 내 경로를 선택한다.
    joint6_min_deg: -270.0
    joint6_max_deg: 270.0
    joint6_limit_margin_deg: 5.0
    joint6_path_step_mm: 10.0
    # 집기 전 빈 그리퍼, 진입 높이에서만 한 바퀴 풀기 허용.
    joint6_rewind_clearance_mm: 50.0
    # 기본 False: 홈의 그리퍼 방향(베이스 기준)을 유지하는 MoveL. J6는 자유롭게 변함.
    # True는 과거 J6=90 관절 고정 스플라인 실험 모드.
    joint6_lock_enabled: false
    joint6_locked_deg: 90.0
    joint6_lock_tolerance_deg: 3.0
    joint6_locked_step_mm: 5.0
    joint6_locked_path_tolerance_mm: 0.5
    # 베이스 플렌지 기준으로 집기·놓기 명령에 적용하는 보정값 [mm].
    # 컨트롤러 TCP는 J6 플랜지 원점. 보정·원점 계산용 222mm와 합산하지 않음.
    tcp_length_at_6mm_mm: 160.0
    # 小(사/졸/병), 中(차/마/상/포), 大(궁) 순서. 모두 mm.
    command_board_z_mm: -20.0
    # 기본 판 Z=-20 고정. 과거 보정 Z 차이는 자동 적용하지 않음.
    # 아래 옵션은 명시적인 수동 미세 보정만 적용. TL/TR/BR/BL 순서.
    board_z_compensation_enabled: false
    board_z_offset_mm: 0.0
    board_z_corner_offsets_mm: [0.0, 0.0, 0.0, 0.0]
    piece_min_widths_mm: [21.0, 27.0, 33.0]
    piece_thicknesses_mm: [6.0, 7.0, 8.0]
    piece_grip_widths_mm: [20.0, 26.0, 32.0]
    # 판 윗면에서 팁 높이. 이전 설정보다 소형 1mm, 중/대형 2mm 하향.
    piece_grip_heights_mm: [2.0, 2.0, 3.0]
    default_object_width_mm: 26.0
    default_opening_allowance_mm: 10.0
    # Compatibility input only: position_cmd cannot set current or speed.
    default_grip_current_ma: 100.0
    release_extra_width_mm: 10.0
    grasp_overtravel_mm: 0.0
    joint_velocity_deg_s: 60.0
    # UI와 동일하게 회전/관절 가속도를 통일 (Home 및 고정-J6 경로).
    joint_acceleration_deg_s2: 120.0
    linear_velocity_mm_s: 120.0
    linear_acceleration_mm_s2: 240.0
    angular_velocity_deg_s: 60.0
    angular_acceleration_deg_s2: 120.0
    workspace_min_mm: [-900.0, -900.0, -300.0]
    workspace_max_mm: [900.0, 900.0, 1000.0]
    mock_home_flange_pose: [400.0, 0.0, 450.0, 0.0, 180.0, 0.0]
    mock_step_delay_sec: 0.05
    virtual_gripper_delay_sec: 0.4
    service_timeout_sec: 5.0
    motion_timeout_sec: 60.0
    # Existing gripper_service_node owns serial/torque/position commands.
    # Wait AFTER publishing position_cmd. No arrival/contact feedback available.
    gripper_command_wait_sec: 1.0
    # Real gripper: wait for bridge command_result instead of guessing 1s.
    # This acknowledges command processing, not physical grip/contact.
    gripper_wait_for_result: true
    gripper_result_timeout_sec: 20.0
    # Realtime UI manipulation options (standalone absolute-coordinate actions do not use vision).
    adaptive_grasp_enabled: true
    refresh_before_pick: true
    retry_move_enabled: true
    verification_frames: 3
    verification_timeout_sec: 3.0
    verification_tolerance_mm: 12.0
    pick_refresh_max_shift_mm: 45.0
    # URDF distal finger mesh width=26mm, depth~22mm. Approximate 2-D swept footprint.
    finger_half_width_mm: 13.0
    finger_depth_mm: 22.0
    neighbor_clearance_mm: 2.0
