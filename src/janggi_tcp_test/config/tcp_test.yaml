/janggi_tcp_test:
  ros__parameters:
    backend: mock
    robot_namespace: dsr01
    expected_flange_tcp_name: ''
    tcp_length_at_6mm_mm: 160.0
    # Explicit model conversion assumption; calibrate against actual position traces.
    position_unit_deg: 0.088
    # MODEL ONLY: position_cmd does not change actual gripper speed/acceleration.
    gripper_profile_velocity: 50
    gripper_profile_acceleration: 100
    # Initial-gap command settling wait only; no arrival feedback.
    gripper_command_wait_sec: 5.0
    stream_rate_hz: 20.0
    servo_time_sec: 0.1
    arm_lookahead_sec: 0.1
    gripper_start_delay_sec: 0.3
    arm_velocity_mm_s: 5.0
    arm_acceleration_mm_s2: 10.0
    max_z_displacement_mm: 30.0
    min_flange_z_mm: -200.0
    max_flange_z_mm: 1000.0
    max_duration_sec: 120.0
    max_stream_gap_sec: 0.25
    feedback_interval_sec: 0.5
    max_feedback_age_sec: 3.0
    max_estimated_tip_error_mm: 3.0
    final_settle_sec: 1.0
    completion_timeout_sec: 8.0
    mock_initial_flange_pose: [400.0, 0.0, 450.0, 0.0, 180.0, 0.0]
    report_directory: /tmp/janggi_tcp_test
    # Arm service/subscriber readiness timeouts. Gripper uses position_cmd only.
    service_timeout_sec: 5.0
    motion_timeout_sec: 60.0
