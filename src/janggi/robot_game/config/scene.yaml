# Geometry is in metres internally. These presentation dimensions are in mm.
# Grid shape and yaw come from calibration; simulation levels the board.
board:
  outer_size_mm: [400.0, 400.0]
  outer_size_source: user_estimate_square_not_measured
  # User-provided physical thickness. Top surface is tabletop + thickness.
  thickness_mm: 10.0
  # Horizontal table surface. Board is level, retaining only calibrated yaw.
  tabletop_z_mm: -30.0
camera:
  model: Intel RealSense D455f
  # Official D455f outline: width x height x depth, including front filter.
  housing_size_mm: [124.0, 29.0, 26.8]
  update_rate_hz: 30.0
  topic: /janggi_sim/d455f
  optical_frame: sim_d455f_color_optical_frame
  near_clip_m: 0.02
  far_clip_m: 10.0
  # RGB-only sensor: no depth rendering or point-cloud generation.

pieces:
  # Assumed plastic density, not a measured mass. SI units kg/m³.
  density: 1200.0
  friction: 0.8
